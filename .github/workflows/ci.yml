name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the package.json engines floor; 24 is what production (systemd) and the Docker image run.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ci-only-secret-that-is-never-used-anywhere-else-1234567890
          NEXTAUTH_URL: http://localhost:3100
      - name: Keep the build for the browser job
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  browser:
    name: Browser tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same Node as the build it downloads and as production.
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts `next start` on port 3100 with its own throwaway database and secrets.
      - run: npm run test:e2e
      - name: Keep traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXTAUTH_SECRET: ci-only-secret-that-is-never-used-anywhere-else-1234567890
    steps:
      - uses: actions/checkout@v4
      # The standalone app (QUASAR_STANDALONE=1 inside the image) and the worker, which only copies src/domain and src/server.
      - run: docker build --target worker -t quasar-worker .
      - run: docker build -t quasar-app .
      - name: App image answers /api/health
        run: |
          docker run -d --name quasar-app -e NEXTAUTH_SECRET -e NEXTAUTH_URL=http://localhost:3000 quasar-app
          for attempt in $(seq 1 60); do
            # The same probe as the compose healthcheck.
            if docker exec quasar-app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 2
          done
          docker logs quasar-app
          exit 1
      - name: Worker image starts
        run: |
          docker run -d --name quasar-worker -e NEXTAUTH_SECRET quasar-worker
          for attempt in $(seq 1 30); do
            if docker logs quasar-worker 2>&1 | grep -q 'Quasar background worker started.'; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' quasar-worker)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs quasar-worker
          exit 1
