<!doctype html>
<html lang="en" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 · Class sheet</title>
<link rel="stylesheet" href="assets/today.css">
<style>
  .sheet{position:fixed;z-index:50;background:var(--popover);border:1px solid var(--border);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
  /* Phone: bottom sheet. Wider: right-hand side sheet. */
  .sheet{left:0;right:0;bottom:0;max-height:82dvh;border-radius:24px 24px 0 0;border-bottom:0;transform:translateY(105%)}
  .sheet.open{transform:none}
  .grab{width:40px;height:4px;border-radius:99px;background:var(--input);margin:10px auto 2px}
  @media (min-width:768px){
    .sheet{left:auto;top:0;width:400px;max-height:none;border-radius:24px 0 0 24px;border:1px solid var(--border);border-right:0;transform:translateX(105%)}
    .grab{display:none}
  }
  .s-head{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 14px;border-bottom:1px solid var(--border)}
  .s-head .t{flex:1;min-width:0}
  .s-head h2{margin:0;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  .s-head p{margin:4px 0 0;font-size:12.5px;color:var(--muted-foreground)}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .fact{display:inline-flex;align-items:center;gap:5px;border-radius:99px;background:var(--muted);color:var(--muted-foreground);font-size:11.5px;font-weight:700;padding:3px 9px}
  .s-body{overflow-y:auto;padding:12px 10px 18px}
  .label{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);padding:4px 8px 8px}
  .person{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:14px}
  .person:hover{background:var(--muted)}
  .person .who{flex:1;min-width:0}
  .person b{display:block;font-size:14px}
  .person small{display:block;font-size:12.5px;color:var(--muted-foreground)}
  .acts{display:flex;gap:6px}
  .you .avatar{background:var(--secondary);color:var(--foreground)}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title"></aside>
<script src="assets/today.js"></script>
<script>
  const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
  function close(){ sheet.classList.remove('open'); scrim.classList.remove('open'); Today.setExpanded(null); }
  function open(period, chip){
    Today.setExpanded(chip);
    const n = period.mates.length;
    sheet.innerHTML = `<div class="grab"></div>
      <div class="s-head"><div class="t">
          <h2 id="s-title"><span class="dot" style="background:${period.color}"></span>${period.name}</h2>
          <p>${period.start} to ${period.end}</p>
          <div class="facts"><span class="fact">${period.block}</span><span class="fact">${Today.icon('pin', 12)} ${period.room}</span><span class="fact">${period.teacher}</span></div>
        </div><button class="btn icon" type="button" aria-label="Close">${Today.icon('x', 16)}</button></div>
      <div class="s-body">
        <div class="label">You and ${n} ${n === 1 ? 'friend' : 'friends'}</div>
        ${period.mates.map((id) => { const f = Today.FRIENDS[id]; return `
          <div class="person">${Today.avatar(id, 'md')}
            <div class="who"><b>${f.name}</b><small>Next: ${f.next} · ${f.nextRoom}</small></div>
            <div class="acts"><button class="btn sm icon" type="button" aria-label="Message ${f.name}" title="Message">${Today.icon('message', 15)}</button><button class="btn sm icon" type="button" aria-label="See ${f.name}'s day" title="See their day">${Today.icon('calendar', 15)}</button></div>
          </div>`; }).join('')}
      </div>`;
    sheet.querySelector('[aria-label="Close"]').onclick = close;
    sheet.classList.add('open'); scrim.classList.add('open');
  }
  Today.render({ onOpen: open });
  scrim.addEventListener('click', close);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
</script>
</body>
</html>
