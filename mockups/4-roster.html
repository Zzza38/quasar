<!doctype html>
<html lang="en" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 · Roster dialog</title>
<link rel="stylesheet" href="assets/today.css">
<style>
  .dialog{position:fixed;z-index:50;left:50%;top:50%;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 48px);display:flex;flex-direction:column;background:var(--popover);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-pop);transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
  .dialog.open{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
  .d-head{display:flex;gap:12px;align-items:flex-start;padding:18px 18px 12px}
  .d-head .t{flex:1;min-width:0}
  .d-head h2{margin:0;font-size:17px;letter-spacing:-.02em}
  .d-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted-foreground);display:flex;align-items:center;gap:7px}
  .search{position:relative;margin:0 18px 12px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-foreground)}
  /* Stand-in for the shadcn Input from primitives.tsx. */
  .search .input{display:flex;align-items:center;height:38px;border-radius:11px;border:1px solid var(--input);background:transparent;padding:0 12px 0 34px;font-size:13.5px;color:var(--muted-foreground)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px;overflow-y:auto}
  @media (max-width:440px){ .grid{grid-template-columns:repeat(2,1fr)} }
  .tile{display:grid;justify-items:center;gap:8px;padding:16px 8px 12px;border-radius:16px;border:1px solid var(--border);background:var(--card);cursor:pointer;text-align:center}
  .tile:hover{background:var(--muted)}
  .tile b{font-size:13.5px;line-height:1.25}
  .tile small{display:block;font-size:11.5px;color:var(--muted-foreground);margin-top:2px}
  .d-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 18px;margin-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}
  @media (max-width:440px){ .d-foot{flex-direction:column;align-items:stretch} .d-foot .btn{width:100%} }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="dialog" id="dlg" role="dialog" aria-modal="true" aria-labelledby="d-title"></div>
<script src="assets/today.js"></script>
<script>
  const dlg = document.getElementById('dlg'), scrim = document.getElementById('scrim');
  function close(){ dlg.classList.remove('open'); scrim.classList.remove('open'); Today.setExpanded(null); }
  function open(period, chip){
    Today.setExpanded(chip);
    const n = period.mates.length;
    dlg.innerHTML = `
      <div class="d-head"><div class="t"><h2 id="d-title">${period.name}</h2>
        <p><span class="dot" style="background:${period.color}"></span>${period.block} · ${period.room} · ${period.teacher}</p></div>
        <button class="btn icon" type="button" aria-label="Close">${Today.icon('x', 16)}</button></div>
      ${n > 5 ? `<div class="search">${Today.icon('search', 15)}<div class="input">Search ${n} friends</div></div>` : ''}
      <div class="grid">${period.mates.map((id) => { const f = Today.FRIENDS[id]; return `
        <button class="tile" type="button" title="See ${f.name}'s day">${Today.avatar(id, 'lg')}<span><b>${f.name}</b><small>${Today.together(id)}</small></span></button>`; }).join('')}</div>
      <div class="d-foot"><span>Only friends who share their timetable show up here.</span><button class="btn sm" type="button">${Today.icon('chat', 14)} Group chat with ${n === 1 ? Today.first(period.mates[0]) : 'all ' + n}</button></div>`;
    dlg.querySelector('[aria-label="Close"]').onclick = close;
    dlg.classList.add('open'); scrim.classList.add('open');
  }
  Today.render({ onOpen: open });
  scrim.addEventListener('click', close);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
</script>
</body>
</html>
