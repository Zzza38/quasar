<!doctype html>
<html lang="en" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 · Faces + where next</title>
<link rel="stylesheet" href="assets/today.css">
<style>
  /* The chip becomes a face stack. */
  .chip.faces{padding:2px 10px 2px 3px;gap:7px}
  .stack{display:flex}
  .stack .avatar{width:20px;height:20px;font-size:9px;box-shadow:0 0 0 2px var(--card)}
  .row.now .stack .avatar{box-shadow:0 0 0 2px var(--now-soft)}
  .stack .avatar + .avatar{margin-left:-4px}
  .pop{position:absolute;z-index:50;width:320px;background:var(--popover);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-pop);padding:14px 6px 6px;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;transition:opacity .14s,transform .14s;pointer-events:none}
  .pop.open{opacity:1;transform:none;pointer-events:auto}
  .faces-row{display:flex;gap:4px;overflow-x:auto;padding:0 8px 12px;scrollbar-width:none}
  .face{display:grid;justify-items:center;gap:5px;width:64px;flex:none;border:0;background:transparent;border-radius:12px;padding:6px 2px;cursor:pointer}
  .face:hover{background:var(--muted)}
  .face span:last-child{font-size:12px;font-weight:700;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sect{border-top:1px solid var(--border);padding:10px 8px 4px}
  .sect h3{margin:0 0 6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground)}
  .group{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:11px}
  .group:hover{background:var(--muted)}
  .group .where{flex:1;min-width:0}
  .group b{display:block;font-size:13.5px}
  .group small{display:block;font-size:12px;color:var(--muted-foreground)}
  .group .stack .avatar{box-shadow:0 0 0 2px var(--popover)}
  .pop-foot{padding:6px 8px 4px}
  .pop-foot .btn{width:100%}
</style>
</head>
<body>
<div class="pop" id="pop" role="dialog" aria-label="Friends in this class"></div>
<script src="assets/today.js"></script>
<script>
  const pop = document.getElementById('pop');
  let openFor = null;
  const stack = (ids, max = 3) => `<span class="stack">${ids.slice(0, max).map((id) => Today.avatar(id, 'xs')).join('')}</span>`;
  function close(){ pop.classList.remove('open'); openFor = null; Today.setExpanded(null); }
  function open(period, chip){
    if (openFor === chip) return close();
    openFor = chip; Today.setExpanded(chip);
    // Group friends by where they go after this class.
    const groups = {};
    for (const id of period.mates) { const f = Today.FRIENDS[id]; (groups[f.next + '|' + f.nextRoom] ??= []).push(id); }
    pop.innerHTML = `
      <div class="faces-row">${period.mates.map((id) => `<button class="face" type="button" title="See ${Today.FRIENDS[id].name}'s day">${Today.avatar(id, 'md')}<span>${Today.first(id)}</span></button>`).join('')}</div>
      <div class="sect"><h3>After class</h3>${Object.entries(groups).map(([key, ids]) => { const [next, room] = key.split('|'); return `
        <div class="group">${stack(ids)}<span class="where"><b>${next}</b><small>${ids.map(Today.first).join(', ')} · ${room}</small></span></div>`; }).join('')}</div>
      <div class="pop-foot"><button class="btn sm" type="button">${Today.icon('users', 14)} Open People</button></div>`;
    const r = chip.getBoundingClientRect();
    const w = Math.min(320, innerWidth - 24);
    pop.style.width = w + 'px';
    pop.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + scrollX + 'px';
    pop.style.top = r.bottom + 8 + scrollY + 'px';
    pop.classList.add('open');
  }
  Today.render({ onOpen: open, chip: (p) => {
    const n = p.mates.length;
    return `${stack(p.mates)}<span>${n === 1 ? 'With ' + Today.first(p.mates[0]) : n + ' friends'}</span>`;
  } });
  document.querySelectorAll('[data-period]').forEach((el) => el.classList.add('faces'));
  addEventListener('click', (e) => { if (!pop.contains(e.target)) close(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  addEventListener('resize', () => { if (openFor) { const c = openFor; openFor = null; c.click(); } });
</script>
</body>
</html>
