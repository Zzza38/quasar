<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quasar — Landing page mockups</title>
<link rel="icon" href="assets/logo.svg">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{--rail:236px;--ink:#0d1016;--panel:#151a22;--line:#242b36;--fg:#e7ecf2;--dim:#8d99a8;--brand:#2dd4e0}
  html,body{height:100%}
  body{margin:0;background:#0a0d12;color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}

  aside{width:var(--rail);flex:none;background:var(--ink);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100dvh}
  .top{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
  .top .b{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.02em}
  .top .b img{width:24px;height:24px;color:var(--brand)}
  .top small{display:block;color:var(--dim);font-size:11.5px;margin-top:6px;letter-spacing:.03em;text-transform:uppercase;font-weight:600}

  nav{padding:8px;display:grid;gap:3px;overflow-y:auto}
  .opt{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:start;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--dim);cursor:pointer;font:inherit;transition:.15s}
  .opt:hover{background:var(--panel);color:var(--fg)}
  .opt[aria-current="true"]{background:var(--panel);border-color:rgba(45,212,224,.35);color:var(--fg);box-shadow:inset 3px 0 0 var(--brand)}
  .opt .k{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#1f2630;font-size:11.5px;font-weight:700;color:var(--dim)}
  .opt .star{color:#facc15;font-size:10px;margin-left:5px}
  .ghead{padding:10px 10px 4px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#59636f}
  .ghead:first-child{padding-top:4px}
  .opt[aria-current="true"] .k{background:var(--brand);color:#052026}
  .opt b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em;color:inherit}
  .opt span{display:block;font-size:11px;color:#6f7c8b;margin-top:1px;line-height:1.32}

  .foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .seg button{flex:1;background:transparent;border:0;border-radius:7px;color:var(--dim);font:600 11.5px/1 inherit;padding:7px 0;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#242c38;color:var(--fg)}
  .lnk{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--dim);font-size:12px;font-weight:600;text-decoration:none;background:var(--panel)}
  .lnk:hover{color:var(--fg);border-color:#313a47}
  .hint{color:#59636f;font-size:10.5px;text-align:center;line-height:1.5}

  main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh;background:#0a0d12}
  .bar{height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--ink);font-size:12.5px;color:var(--dim)}
  .bar .now{color:var(--fg);font-weight:650}
  .bar .w{margin-left:auto;font-variant-numeric:tabular-nums}
  .frame{flex:1;min-height:0;display:grid;place-items:center;padding:0;overflow:auto;background:
    linear-gradient(0deg,#0a0d12,#0a0d12) padding-box}
  .frame.pad{padding:22px}
  iframe{border:0;background:#fff;width:100%;height:100%;display:block}
  .frame.pad iframe{border-radius:14px;box-shadow:0 30px 70px -30px rgba(0,0,0,.85);height:100%;max-height:100%}
  @media(max-width:760px){
    body{flex-direction:column;overflow:auto}
    aside{width:100%;height:auto;flex-direction:column}
    nav{grid-template-columns:1fr;max-height:none}
    main{height:70dvh}
  }
</style>
</head>
<body>

<aside>
  <div class="top">
    <span class="b"><img src="assets/logo-mark.svg" alt=""> Quasar</span>
    <small>Landing page mockups</small>
  </div>
  <nav id="nav"></nav>
  <div class="foot">
    <div class="seg" id="seg">
      <button data-w="full" aria-pressed="true">Full</button>
      <button data-w="1280">Laptop</button>
      <button data-w="820">Tablet</button>
      <button data-w="390">Phone</button>
    </div>
    <a class="lnk" id="newtab" href="6-verdict.html" target="_blank" rel="noopener">Open in new tab ↗</a>
    <p class="hint">Press <b>1</b>–<b>9</b>, <b>0</b> to switch · <b>←</b> <b>→</b> to step</p>
  </div>
</aside>

<main>
  <div class="bar"><span class="now" id="label">1 · Verdict</span><span id="blurb"></span><span class="w" id="wlabel">Full width</span></div>
  <div class="frame" id="frame"><iframe id="view" src="6-verdict.html" title="Mockup preview"></iframe></div>
</main>

<script>
  const MOCKS = [
    { group:'Round 2 · from 4 + 5' },
    { file:'6-verdict.html',    name:'Verdict',    tag:'Switch\u2019s argument, Pocket\u2019s warmth', blurb:'The straight hybrid: blunt headline + live phone, then the comparison table in soft rounded cards.' },
    { file:'7-receipts.html',   name:'Receipts',   tag:'Four weird days, proven',  blurb:'Every claim gets a receipt. Flip each scenario between \u201cusually\u201d and \u201cwith Quasar\u201d.' },
    { file:'8-aurora.html',     name:'Aurora',     tag:'Pocket, gone dark and neon', blurb:'Same phone-first layout and animated demo, completely different mood.' },
    { file:'9-scoreboard.html', name:'Scoreboard', tag:'Score your current app',  blurb:'Interactive: 11 questions, live score meter, a verdict. The comparison table made playable.' },
    { file:'10-week.html',      name:'The Week',   tag:'Scroll-driven story',     blurb:'Mon\u2013Fri of one weird week; the sticky phone updates as you scroll.' },
    { group:'Round 1' },
    { file:'4-switch.html',   name:'Switch',   fav:true, tag:'Blunt, comparison-led',  blurb:'Names the pain, then a comparison table and straight answers.' },
    { file:'5-pocket.html',   name:'Pocket',   fav:true, tag:'Playful, phone-centred', blurb:'Animated live phone demo, bento features, soft colours.' },
    { file:'1-nebula.html',   name:'Nebula',   tag:'Dark, cosmic, premium',  blurb:'Plays on the name. Glowing hero, starfield, phone mock.' },
    { file:'2-daylight.html', name:'Daylight', tag:'Light, product-first',   blurb:'Clean SaaS look. Big app screenshot, features, FAQ.' },
    { file:'3-bell.html',     name:'Bell',     tag:'Editorial, period by period', blurb:'The page is laid out as a school day on a time rail.' },
  ].filter(Boolean);
  const PAGES = MOCKS.filter(m => m.file);
  const nav = document.getElementById('nav'), view = document.getElementById('view');
  const label = document.getElementById('label'), blurb = document.getElementById('blurb');
  const newtab = document.getElementById('newtab'), frame = document.getElementById('frame');
  const wlabel = document.getElementById('wlabel');
  let current = 0;

  const buttons = [];
  MOCKS.forEach(m => {
    if (m.group) {
      const h = document.createElement('div');
      h.className = 'ghead'; h.textContent = m.group;
      nav.appendChild(h);
      return;
    }
    const i = PAGES.indexOf(m);
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    b.innerHTML = `<span class="k">${i + 1}</span><span><b>${m.name}${m.fav ? '<span class="star">\u2605</span>' : ''}</b><span>${m.tag}</span></span>`;
    b.addEventListener('click', () => select(i));
    buttons.push(b);
    nav.appendChild(b);
  });

  function select(i){
    current = i;
    const m = PAGES[i];
    view.src = m.file;
    newtab.href = m.file;
    label.textContent = `${i + 1} · ${m.name}`;
    blurb.textContent = m.blurb;
    buttons.forEach((el, j) => el.setAttribute('aria-current', j === i));
    location.hash = m.file.replace('.html', '');
    try { localStorage.setItem('quasar.mock2', String(i)); } catch {}
  }

  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    const w = b.dataset.w;
    if (w === 'full'){ frame.classList.remove('pad'); view.style.width = '100%'; view.style.maxWidth = 'none'; wlabel.textContent = 'Full width'; }
    else { frame.classList.add('pad'); view.style.width = w + 'px'; view.style.maxWidth = '100%'; wlabel.textContent = w + 'px'; }
  });

  addEventListener('keydown', e => {
    if (e.target.closest('input,textarea')) return;
    if (/^[0-9]$/.test(e.key)) { const n = e.key === '0' ? 10 : parseInt(e.key, 10); if (n <= PAGES.length) select(n - 1); }
    if (e.key === 'ArrowRight') select((current + 1) % PAGES.length);
    if (e.key === 'ArrowLeft') select((current - 1 + PAGES.length) % PAGES.length);
  });

  const fromHash = location.hash.length > 1 ? PAGES.findIndex(m => m.file.replace('.html','') === location.hash.slice(1)) : -1;
  let start = fromHash >= 0 ? fromHash : 0;
  if (fromHash < 0) { try { const v = parseInt(localStorage.getItem('quasar.mock2'), 10); if (v >= 0 && v < PAGES.length) start = v; } catch {} }
  select(start);
</script>
</body>
</html>
