<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lunch menu redesign</title>
<style>
  @font-face { font-family: Manrope; src: url(assets/manrope.woff2) format('woff2'); font-weight: 200 800; }
  :root {
    --background: #0b0d12; --foreground: #eceff5; --card: #13161d; --popover: #171b23; --secondary: #222732; --muted: #1a1e27; --muted-foreground: #9ba4b5;
    --border: #242934; --input: #343a47; --primary: #2dd4e0; --primary-foreground: #06161a; --primary-soft: #0f3a44; --primary-soft-foreground: #a5f3fc;
    --success: #4ade80; --success-soft: #0f2a1b; --warning: #fde68a; --warning-soft: #33290f; --now: #f59e0b; --now-soft: #3a2a0d; --now-foreground: #fcd34d;
    --sidebar: #0f1218; --sidebar-border: #202531; --ring-soft: rgb(236 239 245 / .07);
    --shadow-card: 0 1px 2px rgb(0 0 0 / .3), 0 2px 10px -2px rgb(0 0 0 / .35); --shadow-float: 0 12px 40px -12px rgb(0 0 0 / .6), 0 2px 8px -2px rgb(0 0 0 / .4);
  }
  * { box-sizing: border-box; }
  html { background: var(--background); }
  body { margin: 0; font-family: Manrope, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: var(--foreground); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; } li { list-style: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i12 { width: 12px; height: 12px; stroke-width: 2.4; } svg.i14 { width: 14px; height: 14px; } svg.i16 { width: 16px; height: 16px; stroke-width: 2.2; } svg.i21 { width: 21px; height: 21px; }

  /* ---------- App shell ---------- */
  .app { display: flex; min-height: 100vh; background:
    radial-gradient(1100px 420px at 20% -8%, color-mix(in srgb, var(--primary) 9%, transparent), transparent 70%),
    radial-gradient(800px 360px at 100% 0%, color-mix(in srgb, var(--now) 5%, transparent), transparent 70%), var(--background); }
  .side { width: 256px; flex: none; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; background: var(--sidebar); border-right: 1px solid var(--sidebar-border); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
  .brand img { width: 30px; height: 30px; filter: invert(1) hue-rotate(180deg); }
  .side-top { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 14px; color: var(--muted-foreground); }
  .side-top .brand { color: var(--foreground); }
  .nav { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 12px; font-weight: 600; color: var(--muted-foreground); position: relative; }
  .nav.on { background: var(--primary-soft); color: var(--primary-soft-foreground); } .nav.on svg { stroke-width: 2.4; }
  .nav u { position: absolute; right: 12px; width: 7px; height: 7px; border-radius: 9px; background: var(--primary); }
  .side-foot { margin-top: auto; display: grid; gap: 12px; }
  .pill { display: inline-flex; width: fit-content; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--muted-foreground); background: var(--muted); }
  .acct { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 10px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-card); outline: 1px solid var(--ring-soft); color: var(--muted-foreground); }
  .acct div { flex: 1; min-width: 0; line-height: 1.25; } .acct b { display: block; font-size: 13.5px; color: var(--foreground); } .acct span { font-size: 12px; }
  .avatar { width: 32px; height: 32px; border-radius: 99px; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #06161a; background: linear-gradient(135deg, #67e8f9, #a78bfa); flex: none; }
  .inset { flex: 1; min-width: 0; }
  .topbar { display: none; height: 56px; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgb(236 239 245 / .06); background: var(--background); }
  .topbar .brand { font-size: 16px; gap: 8px; } .topbar .brand img { width: 28px; height: 28px; }
  .topbar .r { display: flex; align-items: center; gap: 14px; color: var(--muted-foreground); } .topbar .avatar { width: 28px; height: 28px; font-size: 12px; }
  .main { width: 100%; max-width: 1120px; margin: 0 auto; padding: 32px 32px 48px; }
  .switch { display: none; grid-template-columns: 1fr 1fr; padding: 4px; margin-bottom: 16px; border-radius: 99px; background: var(--card); border: 1px solid var(--border); }
  .switch span { display: flex; justify-content: center; align-items: center; gap: 6px; height: 34px; border-radius: 99px; font-size: 13.5px; font-weight: 700; color: var(--muted-foreground); }
  .switch span.on { background: var(--primary-soft); color: var(--primary-soft-foreground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 30%, transparent); }
  .tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px 12px; z-index: 5; }
  .dock { display: grid; grid-template-columns: 1fr 1fr 68px 1fr 1fr; align-items: center; padding: 6px; border-radius: 22px; background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(18px) saturate(1.4); box-shadow: var(--shadow-float); outline: 1px solid var(--ring-soft); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 16px; font-size: 10.5px; font-weight: 700; color: var(--muted-foreground); }
  .tab.on { background: var(--primary-soft); color: var(--primary-soft-foreground); }
  .tab.home { margin-top: -20px; padding: 0 0 6px; } .tab.home i { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 99px; background: var(--card); border: 1px solid var(--border); color: var(--foreground); box-shadow: var(--shadow-float); }

  /* ---------- Shared pieces ---------- */
  .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .card { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px; padding: 20px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow-card); outline: 1px solid var(--ring-soft); }
  .ch { display: flex; align-items: flex-start; gap: 12px; }
  .ci { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--primary-soft); color: var(--primary-soft-foreground); flex: none; }
  .ct { flex: 1; min-width: 0; display: grid; gap: 2px; } .ct h2 { font-size: 15.5px; font-weight: 700; letter-spacing: -.015em; line-height: 1.35; } .ct p { font-size: 13px; color: var(--muted-foreground); }
  .ca { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .eb { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }
  .hint { font-size: 12.5px; color: var(--muted-foreground); }
  .link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--primary); }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--secondary); color: var(--foreground); white-space: nowrap; }
  .chip.ok { background: var(--success-soft); color: var(--success); } .chip.now { background: var(--now-soft); color: var(--now-foreground); } .chip.acc { background: var(--primary-soft); color: var(--primary-soft-foreground); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--input); background: var(--card); font-size: 14px; font-weight: 700; color: var(--foreground); white-space: nowrap; }
  .btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  .btn.soft { background: var(--primary-soft); color: var(--primary-soft-foreground); border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 9px; flex: none; }
  .crest { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; font-size: 18px; font-weight: 800; letter-spacing: -.02em; background: var(--primary-soft); color: var(--primary-soft-foreground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 30%, transparent); flex: none; }
  .sh { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .st { flex: 1 1 12rem; min-width: 0; display: grid; gap: 4px; } .st h1 { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; } .st p { color: var(--muted-foreground); }
  .tile { border-radius: 16px; background: color-mix(in srgb, var(--muted) 75%, transparent); box-shadow: inset 0 0 0 1px rgb(236 239 245 / .04); }
  .tile.today { background: color-mix(in srgb, var(--primary-soft) 55%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 32%, transparent); }
  .num { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; font-size: 13px; font-weight: 800; background: var(--card); box-shadow: var(--shadow-card); outline: 1px solid var(--ring-soft); flex: none; }
  .num.on { background: var(--primary-soft); color: var(--primary-soft-foreground); outline-color: color-mix(in srgb, var(--primary) 45%, transparent); box-shadow: none; }
  /* Period rows */
  .periods { display: grid; gap: 2px; }
  .pr { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; font-size: 14px; }
  .pr .pn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pr b { font-weight: 600; } .pr em { font-style: normal; color: var(--muted-foreground); }
  .pr .pt { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pr.now { background: var(--now-soft); } .pr.now .pt { color: var(--now-foreground); } .pr.done { opacity: .5; }
  /* Menus */
  .menu { display: grid; gap: 8px; } .menu dt { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); } .menu dd { font-size: 14px; line-height: 1.5; }
  .menu.cols { grid-template-columns: max-content 1fr; gap: 6px 16px; align-items: baseline; } .menu.cols div { display: contents; }
  /* Votes */
  .votes { display: grid; gap: 6px; } .track { height: 6px; border-radius: 9px; background: var(--secondary); overflow: hidden; } .track i { display: block; height: 100%; border-radius: 9px; background: var(--primary); }
  .vrow { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted-foreground); } .vrow b { color: var(--foreground); }
  .prop { display: grid; gap: 12px; padding: 14px; } .prop > p { font-size: 14px; font-weight: 600; line-height: 1.45; }
  .row2 { display: flex; flex-wrap: wrap; gap: 8px; }
  /* List rows */
  .rows { display: grid; } .rows > * + * { border-top: 1px solid rgb(236 239 245 / .06); }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 12px 4px; }
  .lrow .li { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--secondary); color: var(--foreground); flex: none; }
  .lrow .lt { flex: 1; min-width: 0; display: grid; gap: 1px; } .lrow .lt b { font-size: 14px; font-weight: 700; } .lrow .lt span { font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .lv { font-size: 13px; font-weight: 600; color: var(--muted-foreground); white-space: nowrap; } .lrow > svg { color: var(--muted-foreground); }
  .lrow u { width: 8px; height: 8px; border-radius: 9px; background: var(--primary); flex: none; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 12px; background: var(--muted); border: 1px solid var(--border); }
  .seg span { display: grid; place-items: center; height: 32px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted-foreground); }
  .seg span.on { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--ring-soft); }

  /* ---------- 1 Today board ---------- */
  .bento { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; align-items: stretch; }
  .big { display: flex; align-items: baseline; gap: 10px; } .big strong { font-size: 40px; font-weight: 800; letter-spacing: -.04em; line-height: 1; } .big span { font-size: 13px; color: var(--muted-foreground); }
  .push { margin-top: auto; }
  .card.flexcol { display: flex; flex-direction: column; }
  .cyc { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .cyc .tile { display: grid; gap: 8px; padding: 12px; } .cyc b { font-size: 14px; font-weight: 700; } .cyc .when { font-size: 12px; font-weight: 600; color: var(--muted-foreground); } .cyc .today .when { color: var(--primary-soft-foreground); }
  .cyc .top { display: flex; justify-content: space-between; align-items: baseline; }
  .lets { display: flex; gap: 4px; } .lets i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-style: normal; font-size: 10.5px; font-weight: 800; }
  .lets i.gap { width: 4px; background: none; }
  .quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .quick .tile { display: grid; gap: 4px; padding: 14px; align-content: start; } .quick .qi { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; } .quick p { font-size: 12.5px; color: var(--muted-foreground); line-height: 1.45; } .quick .link { margin-top: 6px; }

  /* ---------- 2 Tabs ---------- */
  .tabs { display: flex; gap: 4px; padding-bottom: 14px; border-bottom: 1px solid rgb(236 239 245 / .07); overflow: hidden; }
  .tabs span { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--muted-foreground); white-space: nowrap; }
  .tabs span.on { background: var(--primary-soft); color: var(--primary-soft-foreground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 30%, transparent); }
  .tabs u { width: 7px; height: 7px; border-radius: 9px; background: var(--primary); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px; }
  .banner .num { width: 48px; height: 48px; border-radius: 15px; font-size: 20px; } .banner .bt { flex: 1 1 200px; min-width: 0; } .banner .bt b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.015em; } .banner .bt span { font-size: 13px; color: var(--muted-foreground); }
  .acc { display: grid; gap: 8px; }
  .arow { display: flex; align-items: center; gap: 12px; padding: 12px; } .arow .at { flex: 1; min-width: 0; display: grid; } .arow .at b { font-size: 14px; font-weight: 700; } .arow .at span { font-size: 12.5px; color: var(--muted-foreground); }
  .arow .when { font-size: 12px; font-weight: 600; color: var(--muted-foreground); } .arow > svg { color: var(--muted-foreground); }
  .open { background: var(--card); box-shadow: var(--shadow-card), inset 0 0 0 1px color-mix(in srgb, var(--primary) 32%, transparent); }
  .open .when { color: var(--primary-soft-foreground); font-weight: 700; }
  .open .body { padding: 10px 12px 12px; border-top: 1px solid rgb(236 239 245 / .06); } .open .foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid rgb(236 239 245 / .06); }
  .facts { display: grid; gap: 10px; } .facts li { display: flex; align-items: center; gap: 10px; font-size: 13.5px; } .facts svg { color: var(--muted-foreground); }
  .off { display: grid; gap: 10px; } .off li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; font-size: 13.5px; } .off li span { font-size: 12.5px; font-weight: 700; color: var(--muted-foreground); font-variant-numeric: tabular-nums; padding-top: 1px; }

  /* ---------- 3 Rail ---------- */
  .rail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 312px; gap: 20px; align-items: start; }
  .rail { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .ident { justify-items: start; gap: 12px; } .ident h1 { font-size: 22px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; } .ident .crest { width: 64px; height: 64px; border-radius: 20px; font-size: 21px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; } .stats div { padding: 10px; text-align: center; } .stats b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.02em; } .stats span { font-size: 11px; font-weight: 700; color: var(--muted-foreground); }
  .mini { display: grid; gap: 2px; } .mini li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; font-size: 13.5px; font-weight: 600; } .mini li span { margin-left: auto; font-size: 12px; color: var(--muted-foreground); } .mini .lets i { width: 18px; height: 18px; font-size: 10px; }
  .mini li.on { background: color-mix(in srgb, var(--primary-soft) 60%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 30%, transparent); } .mini li.on span { color: var(--primary-soft-foreground); font-weight: 700; }
  .week { display: grid; gap: 8px; } .week .tile { display: grid; gap: 8px; padding: 14px; } .week .wh { display: flex; align-items: center; justify-content: space-between; gap: 8px; } .week .wh b { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; } .weeknav b { font-size: 14px; font-weight: 700; } .ib { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--input); color: var(--muted-foreground); }
  .nowline { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; } .nowline .tile { padding: 14px; display: grid; gap: 3px; } .nowline b { font-size: 16px; font-weight: 700; letter-spacing: -.015em; } .nowline span { font-size: 12.5px; color: var(--muted-foreground); }

  /* ---------- 4 Grid ---------- */
  .matrix { position: relative; display: grid; grid-template-columns: 92px repeat(6, minmax(0, 1fr)); gap: 6px; }
  .matrix .colhi { grid-row: 1 / -1; margin: -6px -3px; border-radius: 16px; background: color-mix(in srgb, var(--primary-soft) 45%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 32%, transparent); }
  .matrix > * { position: relative; }
  .mh { display: grid; justify-items: center; gap: 1px; padding: 6px 0 8px; } .mh b { font-size: 14px; font-weight: 700; } .mh span { font-size: 12px; font-weight: 600; color: var(--muted-foreground); } .mh.on span { color: var(--primary-soft-foreground); font-weight: 700; }
  .ax { display: grid; align-content: center; font-size: 12px; font-weight: 600; color: var(--muted-foreground); font-variant-numeric: tabular-nums; line-height: 1.35; }
  .cell { display: grid; align-content: center; gap: 1px; min-height: 58px; padding: 8px 10px; border-radius: 11px; font-size: 13px; line-height: 1.25; } .cell b { font-weight: 700; } .cell span { font-size: 11.5px; opacity: .75; }
  .band { grid-column: 2 / -1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; border-radius: 11px; background: var(--muted); border: 1px dashed var(--input); font-size: 12.5px; font-weight: 700; color: var(--muted-foreground); }
  .lunchcols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; } .lunchcols .tile { display: grid; gap: 10px; padding: 14px; align-content: start; } .lunchcols .wh { display: flex; justify-content: space-between; align-items: baseline; } .lunchcols .wh b { font-size: 14px; font-weight: 700; } .lunchcols .menu dd { font-size: 13px; }
  .strip { display: grid; grid-template-columns: 1.3fr 1fr 1fr; } .strip > div { display: flex; align-items: center; gap: 12px; padding: 4px 18px; } .strip > div + div { border-left: 1px solid rgb(236 239 245 / .07); } .strip > div:first-child { padding-left: 0; } .strip > div:last-child { padding-right: 0; }
  .strip .lt { flex: 1; min-width: 0; display: grid; gap: 1px; } .strip .lt b { font-size: 14px; font-weight: 700; } .strip .lt span { font-size: 12.5px; color: var(--muted-foreground); }
  .daypick { display: none; grid-template-columns: repeat(6, 1fr); gap: 6px; } .daypick span { display: grid; justify-items: center; gap: 1px; padding: 7px 0; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; font-weight: 800; } .daypick span small { font-size: 10px; font-weight: 700; color: var(--muted-foreground); }
  .daypick span.on { background: var(--primary-soft); color: var(--primary-soft-foreground); border-color: color-mix(in srgb, var(--primary) 40%, transparent); } .daypick span.on small { color: inherit; }
  .only-phone { display: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted-foreground); } .meta span { display: inline-flex; align-items: center; gap: 6px; }

  /* ---------- 5 List + detail ---------- */
  .md { display: grid; grid-template-columns: 348px minmax(0, 1fr); gap: 20px; align-items: start; }
  .group { display: grid; gap: 6px; } .group > .eb { padding: 0 6px; }
  .group .card { padding: 4px 12px; gap: 0; } .group .lrow { padding: 11px 2px; }
