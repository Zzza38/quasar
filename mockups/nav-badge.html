<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sidebar count badge</title>
<style>
  @font-face { font-family: Manrope; src: url(assets/manrope.woff2) format('woff2'); font-weight: 200 800; }
  :root {
    --background: #0b0d12; --foreground: #eceff5; --card: #13161d; --muted: #1a1e27; --muted-foreground: #9ba4b5;
    --border: #242934; --sidebar: #0f1218; --sidebar-border: #202531;
    --primary: #2dd4e0; --primary-foreground: #06161a; --primary-soft: #0f3a44; --primary-soft-foreground: #a5f3fc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: Manrope, system-ui, sans-serif; padding: 28px; }
  .grid { display: flex; gap: 22px; flex-wrap: wrap; }
  .col { display: grid; gap: 10px; align-content: start; }
  .tag { font-size: 13px; font-weight: 700; color: var(--muted-foreground); padding-left: 4px; }
  .tag b { color: var(--foreground); margin-right: 6px; }
  aside { width: 244px; background: var(--sidebar); border: 1px solid var(--sidebar-border); border-radius: 18px; padding: 16px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 14px; font-weight: 800; font-size: 17px; }
  .brand img { width: 26px; height: 26px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  li a { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 12px;
    color: var(--muted-foreground); font-size: 14px; font-weight: 600; text-decoration: none; }
  li a:hover, li a.hover { background: var(--muted); color: var(--foreground); }
  li a.active { background: var(--primary-soft); color: var(--primary-soft-foreground); }
  svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .active svg { stroke-width: 2.4; }
  .label { flex: 1; }
  .n { font-variant-numeric: tabular-nums; }

  /* 1 Quiet number: just the count, muted, no shape */
  .v1 .n { font-size: 12.5px; font-weight: 600; color: var(--muted-foreground); opacity: .8; }
  .v1 a.hover .n { color: var(--foreground); opacity: 1; }

  /* 2 Soft chip: the active-row tint, flat 1px ring, squarer corners */
  .v2 .n { height: 20px; min-width: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 6px; font-size: 11px; font-weight: 700;
    background: var(--primary-soft); color: var(--primary-soft-foreground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 22%, transparent); }

  /* 3 Neutral chip: grey until the row is hovered */
  .v3 .n { height: 20px; min-width: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 6px; font-size: 11px; font-weight: 700;
    background: var(--muted); color: var(--muted-foreground); box-shadow: inset 0 0 0 1px var(--border); }
  .v3 a.hover .n { background: #222732; color: var(--foreground); }

  /* 4 Inline: the count sits right after the label, small and dim */
  .v4 .label { flex: 0 1 auto; }
  .v4 .n { font-size: 12px; font-weight: 600; color: var(--muted-foreground); opacity: .75; margin-left: -4px; }
  .v4 .n::before { content: '·'; margin-right: 6px; opacity: .6; }

  /* 5 Dot: a small dot says "something's here"; the number shows on hover */
  .v5 .n { display: grid; grid-template-areas: 'x'; justify-items: end; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--foreground); }
  .v5 .n > * { grid-area: x; transition: opacity .15s; }
  .v5 .n i { width: 7px; height: 7px; border-radius: 9px; background: var(--primary); }
  .v5 .n span { opacity: 0; }
  .v5 a.hover .n i { opacity: 0; }
  .v5 a.hover .n span { opacity: 1; }

  .note { font-size: 12px; color: var(--muted-foreground); max-width: 244px; padding-left: 4px; line-height: 1.4; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<svg style="display:none">
  <symbol id="home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="calendar" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
  <symbol id="tasks" viewBox="0 0 24 24"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
  <symbol id="school" viewBox="0 0 24 24"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="message" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
</svg>
<script>
  const VARIANTS = [
    [1, 'Quiet number', 'Just the digits, dim. Brightens on hover.'],
    [2, 'Soft chip', 'Same tint as the selected row, flat 1px ring, no bright fill.'],
    [3, 'Neutral chip', 'Grey chip that blends into the sidebar.'],
    [4, 'Inline', 'Count follows the label instead of hugging the edge.'],
    [5, 'Dot', 'A small dot only. The number appears on hover (Messages row is hovered here).'],
  ];
  const NAV = [['home', 'Today'], ['calendar', 'Schedule'], ['tasks', 'Tasks', 17], ['book', 'Classes'], ['school', 'School'], ['users', 'People', 1], ['message', 'Messages', 3]];
  const only = Number(new URLSearchParams(location.search).get('v'));
  const grid = document.getElementById('grid');
  for (const [v, name, note] of VARIANTS) {
    if (only && only !== v) continue;
    const items = NAV.map(([icon, label, count], i) => {
      const cls = i === 0 ? 'active' : label === 'Messages' ? 'hover' : '';
      const n = count ? (v === 5 ? `<span class="n"><i></i><span>${count}</span></span>` : `<span class="n">${count}</span>`) : '';
      return `<li><a href="#" class="${cls}"><svg><use href="#${icon}"/></svg><span class="label">${label}</span>${n}</a></li>`;
    }).join('');
    grid.insertAdjacentHTML('beforeend', `<div class="col v${v}"><div class="tag"><b>${v}</b>${name}</div>
      <aside><div class="brand">Quasar</div><ul>${items}</ul></aside>
      <div class="note">${note}</div></div>`);
  }
</script>
</body>
</html>
