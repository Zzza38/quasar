<!doctype html>
<html lang="en" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 · Inline expand</title>
<link rel="stylesheet" href="assets/today.css">
<style>
  .chip .caret{display:inline-flex;transition:transform .2s}
  .chip[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .slot{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease-out}
  .slot.open{grid-template-rows:1fr}
  .slot > div{overflow:hidden;min-height:0}
  .tray{margin-top:10px;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--background) 55%,transparent);border:1px solid var(--border)}
  .row.now .tray{background:color-mix(in srgb,var(--background) 45%,transparent);border-color:color-mix(in srgb,var(--now) 22%,transparent)}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px 0 4px;border-radius:99px;border:1px solid var(--input);background:var(--card);font-size:13px;font-weight:700;cursor:pointer}
  .pill:hover{background:var(--muted)}
  .tray-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--muted-foreground)}
</style>
</head>
<body>
<script src="assets/today.js"></script>
<script>
  let openFor = null;
  function collapse(){ document.querySelectorAll('.slot.open').forEach((s) => s.classList.remove('open')); Today.setExpanded(null); openFor = null; }
  function open(period, chip){
    const wasOpen = openFor === period.id;
    collapse();
    if (wasOpen) return;
    openFor = period.id; Today.setExpanded(chip);
    const slot = document.querySelector(`[data-slot="${period.id}"]`);
    const n = period.mates.length;
    slot.innerHTML = `<div><div class="tray">
      <div class="pills">${period.mates.map((id) => `<button class="pill" type="button" title="See ${Today.FRIENDS[id].name}'s day">${Today.avatar(id, 'xs')}${Today.first(id)}</button>`).join('')}</div>
      <div class="tray-foot"><span>${n === 1 ? '1 friend shares' : n + ' friends share'} this class with you</span><button class="btn sm" type="button">People ${Today.icon('arrow', 13)}</button></div>
    </div></div>`;
    slot.offsetHeight;
    slot.classList.add('open');
  }
  Today.render({ onOpen: open, chip: (p) => `${Today.defaultChip(p)}<span class="caret">${Today.icon('down', 12, 2.6)}</span>` });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') collapse(); });
</script>
</body>
</html>
