<!doctype html>
<html lang="en" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 · Popover list</title>
<link rel="stylesheet" href="assets/today.css">
<style>
  .pop{position:absolute;z-index:50;width:300px;background:var(--popover);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-pop);padding:6px;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;transition:opacity .14s,transform .14s;pointer-events:none}
  .pop.open{opacity:1;transform:none;pointer-events:auto}
  .pop-head{padding:8px 10px 8px}
  .pop-head b{display:block;font-size:13.5px}
  .pop-head span{font-size:12px;color:var(--muted-foreground)}
  .list{display:grid;gap:1px;max-height:288px;overflow-y:auto}
  .person{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:11px;background:transparent;text-align:left;cursor:pointer}
  .person:hover{background:var(--muted)}
  .person .who{flex:1;min-width:0}
  .person b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person small{display:block;font-size:12px;color:var(--muted-foreground)}
  .person .chev{color:var(--muted-foreground)}
  .pop-foot{border-top:1px solid var(--border);margin:6px -6px -6px;padding:8px}
  .pop-foot .btn{width:100%}
</style>
</head>
<body>
<div class="pop" id="pop" role="dialog" aria-label="Friends in this class"></div>
<script src="assets/today.js"></script>
<script>
  const pop = document.getElementById('pop');
  let openFor = null;
  function close(){ pop.classList.remove('open'); openFor = null; Today.setExpanded(null); }
  function open(period, chip){
    if (openFor === chip) return close();
    openFor = chip; Today.setExpanded(chip);
    const n = period.mates.length;
    pop.innerHTML = `
      <div class="pop-head"><b>${n} ${n === 1 ? 'friend' : 'friends'} in this class</b><span>${period.name.length > 26 ? period.block : period.name} · ${period.start}</span></div>
      <div class="list">${period.mates.map((id) => `
        <button class="person" type="button" title="See ${Today.FRIENDS[id].name}'s day">${Today.avatar(id, 'sm')}
          <span class="who"><b>${Today.FRIENDS[id].name}</b><small>${Today.together(id)}</small></span>
          <span class="chev">${Today.icon('chevron', 16)}</span></button>`).join('')}</div>
      <div class="pop-foot"><button class="btn sm" type="button">${Today.icon('users', 14)} Open People</button></div>`;
    const r = chip.getBoundingClientRect();
    const w = Math.min(300, innerWidth - 24);
    pop.style.width = w + 'px';
    pop.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + scrollX + 'px';
    pop.style.top = r.bottom + 8 + scrollY + 'px';
    pop.classList.add('open');
  }
  Today.render({ onOpen: open });
  addEventListener('click', (e) => { if (!pop.contains(e.target)) close(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  addEventListener('resize', () => { if (openFor) { const c = openFor; openFor = null; c.click(); } });
</script>
</body>
</html>
