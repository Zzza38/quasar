<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages entry on phones</title>
<style>
  @font-face { font-family: Manrope; src: url(assets/manrope.woff2) format('woff2'); font-weight: 200 800; }
  :root {
    --background: #0b0d12; --foreground: #eceff5; --card: #13161d; --popover: #171b23; --muted: #1a1e27; --muted-foreground: #9ba4b5;
    --border: #242934; --primary: #2dd4e0; --primary-foreground: #06161a; --primary-soft: #0f3a44; --primary-soft-foreground: #a5f3fc;
    --shadow-float: 0 12px 40px -12px rgb(0 0 0 / .6), 0 2px 8px -2px rgb(0 0 0 / .4); --ring-soft: rgb(236 239 245 / .08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #05060a; font-family: Manrope, system-ui, sans-serif; color: var(--foreground); padding: 28px 32px 32px; }
  h1.page { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  p.lede { margin: 0 0 22px; color: var(--muted-foreground); font-size: 14px; max-width: 820px; line-height: 1.5; }
  .row { display: flex; gap: 36px; align-items: flex-start; }
  .cap { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }

  .phone { position: relative; width: 390px; height: 844px; border-radius: 46px; overflow: hidden; background: var(--background); outline: 10px solid #1d2028; outline-offset: 0; box-shadow: 0 30px 80px -30px #000; isolation: isolate; }
  .status { height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-size: 15px; font-weight: 700; }
  .status i { display: inline-block; width: 26px; height: 12px; border-radius: 4px; border: 1.5px solid var(--foreground); opacity: .85; }
  .topbar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgb(236 239 245 / .06); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
  .brand img { width: 28px; height: 28px; filter: invert(1) hue-rotate(180deg); }
  .tb-right { display: flex; align-items: center; gap: 2px; }
  .ibtn { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 99px; color: var(--muted-foreground); }
  .avatar { width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #06161a; background: linear-gradient(135deg, #67e8f9, #a78bfa); }
  svg.i { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .badge { position: absolute; display: grid; place-items: center; height: 18px; min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--primary); color: var(--primary-foreground); font-size: 11px; font-weight: 800; line-height: 1; }

  .main { padding: 20px 16px 0; display: grid; gap: 14px; }
  .main h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
  .sub { color: var(--muted-foreground); font-size: 14px; margin-top: -8px; }
  .card { border-radius: 22px; background: var(--card); box-shadow: 0 1px 2px rgb(0 0 0 / .3); outline: 1px solid var(--ring-soft); }
  .now { padding: 18px 20px; display: grid; gap: 10px; background: linear-gradient(120deg, #155e75, #0e3b4a); outline: none; }
  .now .eb { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .now b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .bar { height: 7px; border-radius: 9px; background: rgb(255 255 255 / .2); } .bar div { height: 100%; width: 62%; border-radius: 9px; background: #fff; }
  .next { padding: 6px 0; }
  .tl { display: flex; align-items: center; gap: 12px; padding: 11px 16px; }
  .tl .t { width: 46px; font-size: 13px; font-weight: 700; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .tl .pill { width: 4px; height: 34px; border-radius: 9px; }
  .tl strong { display: block; font-size: 15px; } .tl span { font-size: 13px; color: var(--muted-foreground); }

  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px 30px; z-index: 5; }
  .glass { background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(18px) saturate(1.4); }
  .dock { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 6px; border-radius: 22px; box-shadow: var(--shadow-float); outline: 1px solid var(--ring-soft); }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0; border-radius: 16px; font-size: 10.5px; font-weight: 700; color: var(--muted-foreground); }
  .tab.on { background: var(--primary-soft); color: var(--primary-soft-foreground); }
  .tab.on svg { stroke-width: 2.4; }
  .tab .badge { left: calc(50% + 6px); top: 2px; }
  .seven .tab { font-size: 9.8px; letter-spacing: -.01em; }

  /* Messages list */
  .ml { padding: 18px 16px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .ml-h { display: flex; align-items: center; justify-content: space-between; }
  .ml-h h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
  .obtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 99px; border: 1px solid var(--border); color: var(--foreground); }
  .search { display: flex; align-items: center; gap: 8px; height: 40px; border-radius: 99px; padding: 0 14px; background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 15px; }
  .search svg { width: 17px; height: 17px; }
  .chat { display: flex; align-items: center; gap: 12px; padding: 10px 4px; position: relative; }
  .chat + .chat::before { content: ''; position: absolute; top: 0; left: 64px; right: 4px; height: 1px; background: rgb(236 239 245 / .07); }
  .av { width: 48px; height: 48px; border-radius: 99px; display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #0b0d12; flex: none; }
  .chat .body { flex: 1; min-width: 0; }
  .chat .top { display: flex; justify-content: space-between; gap: 8px; }
  .chat strong { font-size: 15.5px; } .chat time { font-size: 12.5px; color: var(--muted-foreground); }
  .chat p { margin: 2px 0 0; font-size: 14px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat.unread p { color: var(--foreground); font-weight: 600; }
  .chat .dot { width: 10px; height: 10px; border-radius: 99px; background: var(--primary); flex: none; }

  /* 2 centre bubble */
  .split3 { display: grid; grid-template-columns: 1fr 1fr 1fr 64px 1fr 1fr 1fr; }
  .bubble { position: relative; justify-self: center; align-self: center; width: 54px; height: 54px; margin-top: -26px; border-radius: 99px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--border); color: var(--foreground); box-shadow: var(--shadow-float); }
  .bubble.on { background: var(--primary-soft); color: var(--primary-soft-foreground); border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
  .bubble .badge { top: -3px; right: -4px; }
  .bubble svg { width: 23px; height: 23px; }

  /* 3 split dock */
  .duo { display: flex; gap: 8px; align-items: stretch; }
  .duo .dock { flex: 1; }
  .duo .tab { font-size: 9.8px; }
  .solo { position: relative; width: 62px; border-radius: 22px; display: grid; place-items: center; box-shadow: var(--shadow-float); outline: 1px solid var(--ring-soft); color: var(--foreground); }
  .solo.on { background: var(--primary-soft); color: var(--primary-soft-foreground); }
  .solo .badge { top: 4px; right: 4px; }
  .solo svg { width: 24px; height: 24px; }

  /* 4 segmented */
  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 99px; background: var(--card); border: 1px solid var(--border); }
  .seg span { display: flex; justify-content: center; align-items: center; gap: 6px; height: 34px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--muted-foreground); }
  .seg span.on { background: var(--primary-soft); color: var(--primary-soft-foreground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 30%, transparent); }
  .seg .n { position: static; height: 18px; }
  .seg span.on .n { background: var(--primary); color: var(--primary-foreground); }

  /* 5 peek bar + sheet */
  .peek { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 8px 10px 8px 8px; border-radius: 18px; box-shadow: var(--shadow-float); outline: 1px solid var(--ring-soft); }
  .peek .av { width: 32px; height: 32px; font-size: 13px; }
  .peek .txt { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.25; }
  .peek .txt b { display: block; font-size: 13px; }
  .peek .txt span { display: block; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peek .badge { position: static; }
  .peek .chev { color: var(--muted-foreground); width: 18px; height: 18px; }
  .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .55); z-index: 6; }
  .behind { transform: scale(.93) translateY(10px); border-radius: 30px; overflow: hidden; height: 100%; filter: brightness(.7); transform-origin: top center; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 64px; z-index: 7; border-radius: 28px 28px 0 0; background: var(--popover); outline: 1px solid var(--ring-soft); box-shadow: 0 -20px 50px -20px #000; }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: rgb(236 239 245 / .25); margin: 8px auto 0; }
  .sheet .ml { padding-top: 10px; }
  /* 6 home bubble */
  .homedock { display: grid; align-items: center; padding: 6px; border-radius: 22px; box-shadow: var(--shadow-float); outline: 1px solid var(--ring-soft); }
  .homedock .side { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .homedock .bubble { margin-top: -26px; }
  .homedock .bubble.on { background: var(--primary-soft); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const P = {
  home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  tasks: '<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  school: '<path d="M14 22v-4a2 2 0 1 0-4 0v4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M18 5v17"/><path d="m4 6 8-4 8 4"/><path d="M6 5v17"/><circle cx="12" cy="9" r="2"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  message: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  pen: '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>',
  up: '<path d="m18 15-6-6-6 6"/>',
  userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
};
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${P[n]}</svg>`;
const UNREAD = 3;
const badge = (n = UNREAD, cls = 'badge') => `<span class="${cls}">${n}</span>`;

const statusBar = `<div class="status"><span>9:41</span><i></i></div>`;
const topbar = (withMsg) => `<header class="topbar"><div class="brand"><img src="assets/logo-mark.svg" alt="">Quasar</div>
  <div class="tb-right"><span class="ibtn">${ic('cloud')}</span>${withMsg ? `<span class="ibtn">${ic('message')}<span class="badge" style="right:-2px;top:-2px">${UNREAD}</span></span>` : ''}<span class="ibtn"><span class="avatar">Z</span></span></div></header>`;

const today = `<div class="main"><h2>Today</h2><div class="sub">Sunday, November 1 · Day C</div>
  <div class="card now"><span class="eb">Now · Period 3</span><b>AP Chemistry</b><div class="bar"><div></div></div><span style="font-size:13.5px">Ends in 14 min · then Lunch</span></div>
  <div class="card next">
    <div class="tl"><span class="t">11:05</span><span class="pill" style="background:#f59e0b"></span><div><strong>Lunch</strong><span>Dining hall</span></div></div>
    <div class="tl"><span class="t">11:50</span><span class="pill" style="background:#a78bfa"></span><div><strong>English 11</strong><span>Room 204</span></div></div>
    <div class="tl"><span class="t">12:45</span><span class="pill" style="background:#34d399"></span><div><strong>Precalculus</strong><span>Room 118</span></div></div>
    <div class="tl"><span class="t">1:40</span><span class="pill" style="background:#60a5fa"></span><div><strong>US History</strong><span>Room 310</span></div></div>
  </div></div>`;

const CHATS = [
  ['Maya R.', 'are you doing the chem lab writeup tonight', '9:38', '#fda4af', true],
  ['AP Chem study', 'Leo: who has the answer key for 4.2', '9:12', '#67e8f9', true],
  ['Jordan', 'lol ok see you at lunch', '8:57', '#fcd34d', true],
  ['Priya', 'You: sent the notes', 'Sat', '#a7f3d0', false],
  ['Debate team', 'Sam: practice moved to thursday', 'Fri', '#c4b5fd', false],
  ['Eli', 'bet', 'Thu', '#93c5fd', false],
];
const chatRows = (n = 6) => CHATS.slice(0, n).map(([name, msg, t, c, u]) => `<div class="chat${u ? ' unread' : ''}"><span class="av" style="background:${c}">${name[0]}</span>
  <div class="body"><div class="top"><strong>${name}</strong><time>${t}</time></div><p>${msg}</p></div>${u ? '<span class="dot"></span>' : ''}</div>`).join('');
const list = (title = 'Messages', extra = '', n = 6) => `<div class="ml"><div class="ml-h"><h2>${title}</h2><span class="obtn">${ic('pen')}</span></div>${extra}
  <div class="search">${ic('search')}Search chats</div><div>${chatRows(n)}</div></div>`;

const TABS = [['today', 'Today', 'home'], ['schedule', 'Schedule', 'calendar'], ['tasks', 'Tasks', 'tasks'], ['classes', 'Classes', 'book'], ['school', 'School', 'school'], ['people', 'People', 'users']];
const tab = ([id, label, icon], on, count) => `<span class="tab${on ? ' on' : ''}">${ic(icon)}<span>${label}</span>${count ? badge(count) : ''}</span>`;
const dock = (active, extra = [], cls = '') => `<div class="dock glass ${cls}">${[...TABS, ...extra].map((t) => tab(t, t[0] === active, t[0] === 'messages' ? UNREAD : 0)).join('')}</div>`;

const V = {
  1: { name: 'Seventh tab', lede: 'Messages moves out of the corner and into the dock as a seventh tab called "Chats". Same place as every other app, one thumb tap, badge on the tab. Labels drop half a point so seven fit at 360px.',
    closed: () => topbar(false) + today + `<div class="tabbar">${dock('today', [['messages', 'Chats', 'message']], 'seven')}</div>`,
    open: () => topbar(false) + list() + `<div class="tabbar">${dock('messages', [['messages', 'Chats', 'message']], 'seven')}</div>` },
  2: { name: 'Centre bubble', lede: 'A round Messages button sits raised in the middle of the dock, three tabs on each side. Hard to miss, easy to hit with either thumb. Flat card fill with a border, no glow; it turns the soft accent when Messages is open.',
    closed: () => topbar(false) + today + `<div class="tabbar"><div class="dock glass split3">${TABS.slice(0, 3).map((t) => tab(t, t[0] === 'today')).join('')}<span class="bubble">${ic('message')}${badge()}</span>${TABS.slice(3).map((t) => tab(t)).join('')}</div></div>`,
    open: () => topbar(false) + list() + `<div class="tabbar"><div class="dock glass split3">${TABS.slice(0, 3).map((t) => tab(t)).join('')}<span class="bubble on">${ic('message')}</span>${TABS.slice(3).map((t) => tab(t)).join('')}</div></div>` },
  3: { name: 'Split dock', lede: 'The six-tab dock stays as is, and Messages gets its own round button beside it at the bottom (the iOS 26 search-tab layout). It reads as "the chat button" instead of another section, and it sits where your thumb already is.',
    closed: () => topbar(false) + today + `<div class="tabbar"><div class="duo">${dock('today')}<span class="solo glass">${ic('message')}${badge()}</span></div></div>`,
    open: () => topbar(false) + list() + `<div class="tabbar"><div class="duo">${dock('')}<span class="solo on">${ic('message')}</span></div></div>` },
  4: { name: 'Chats inside People', lede: 'No new button at all. People becomes the social tab with a Chats / Friends switch at the top, and it opens on Chats when you have unread messages. The People badge counts unread chats plus friend requests.',
    closed: () => topbar(false) + today + `<div class="tabbar"><div class="dock glass">${TABS.map((t) => tab(t, t[0] === 'today', t[0] === 'people' ? UNREAD + 1 : 0)).join('')}</div></div>`,
    open: () => topbar(false) + list('People', `<div class="seg"><span class="on">${ic('message')} Chats <span class="badge n">${UNREAD}</span></span><span>${ic('users')} Friends <span class="badge n" style="background:var(--muted);color:var(--foreground)">1</span></span></div>`, 5) + `<div class="tabbar"><div class="dock glass">${TABS.map((t) => tab(t, t[0] === 'people')).join('')}</div></div>` },
  5: { name: 'Peek bar + sheet', lede: 'A slim bar above the dock shows the newest unread message. Tap it (or swipe up) and Messages slides up as a near-full-height sheet over whatever you were doing; swipe down and you are back where you were. With nothing unread the bar shrinks to a small "Messages" pill.',
    closed: () => topbar(false) + today + `<div class="tabbar"><div class="peek glass"><span class="av" style="background:#fda4af">M</span><div class="txt"><b>Maya R.</b><span>are you doing the chem lab writeup tonight</span></div>${badge(UNREAD)}${ic('up', 'i chev')}</div>${dock('today')}</div>`,
    open: () => `<div class="behind">${topbar(false) + today}</div><div class="scrim"></div><div class="sheet"><div class="grab"></div>${list('Messages', '', 6)}</div>` },
};


const BY = Object.fromEntries(TABS.map((t) => [t[0], t]));
const homeDock = (left, right, active, peopleCount = UNREAD + 1) => `<div class="homedock glass" style="grid-template-columns: 1fr 66px 1fr">
  <div class="side">${left.map((id) => tab(BY[id], id === active, id === 'people' ? peopleCount : 0)).join('')}</div>
  <span class="bubble${active === 'today' ? ' on' : ''}">${ic('home')}</span>
  <div class="side">${right.map((id) => tab(BY[id], id === active, id === 'people' ? peopleCount : 0)).join('')}</div></div>`;
const peopleOpen = list('People', `<div class="seg"><span class="on">${ic('message')} Chats <span class="badge n">${UNREAD}</span></span><span>${ic('users')} Friends <span class="badge n" style="background:var(--muted);color:var(--foreground)">1</span></span></div>`, 5);
const DOCKS = {
  a: { name: 'A. Home in the middle, 2 tabs left, 3 right', lede: 'Keeps every section. Home is exactly centred, so the two left tabs are wider than the three right ones.', left: ['schedule', 'tasks'], right: ['classes', 'school', 'people'] },
  b: { name: 'B. School folds into Classes, 2 and 2', lede: 'Symmetric dock. The School page (bell schedule, lunch menu, class directory, proposals) becomes a section of the Classes tab.', left: ['schedule', 'tasks'], right: ['classes', 'people'] },
};
const v = new URLSearchParams(location.search).get('v') ?? '0';
const app = document.getElementById('app');
if (v === 'a' || v === 'b') {
  const d = DOCKS[v];
  app.innerHTML = `<h1 class="page">${d.name}</h1><p class="lede">${d.lede}</p>
    <div class="row"><div><p class="cap">Today</p><div class="phone">${statusBar + topbar(false) + today}<div class="tabbar">${homeDock(d.left, d.right, 'today')}</div></div></div>
    <div><p class="cap">People (chats)</p><div class="phone">${statusBar + topbar(false) + peopleOpen}<div class="tabbar">${homeDock(d.left, d.right, 'people')}</div></div></div></div>`;
} else if (v === '0') {
  app.innerHTML = `<h1 class="page">Today: Messages is a corner icon</h1><p class="lede">The bare 44px icon between the sync cloud and the avatar.</p><div class="row"><div class="phone">${statusBar + topbar(true) + today}<div class="tabbar">${dock('today')}</div></div></div>`;
} else {
  const d = V[v];
  app.innerHTML = `<h1 class="page">${v}. ${d.name}</h1><p class="lede">${d.lede}</p>
    <div class="row"><div><p class="cap">Closed</p><div class="phone">${statusBar + d.closed()}</div></div><div><p class="cap">Open</p><div class="phone">${v === '5' ? d.open().replace('<div class="behind">', `<div class="behind">${statusBar}`) : statusBar + d.open()}</div></div></div>`;
}
</script>
</body>
</html>
