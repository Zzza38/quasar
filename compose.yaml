services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_PATH: /app/data/whatsnext.sqlite
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - whatsnext-data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    init: true
    stop_grace_period: 5m
    env_file: .env.local
    environment:
      DATABASE_PATH: /app/data/whatsnext.sqlite
    volumes:
      - whatsnext-data:/app/data
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  whatsnext-data:
