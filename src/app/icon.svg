<!-- Orbit -->
<path d="M311 523 C244 563 207 623 252 657 C308 700 439 686 582 626" fill="none" stroke="#fff" stroke-width="31" stroke-linecap="round"/>
<path d="M311 523 C244 563 207 623 252 657 C308 700 439 686 582 626" fill="none" stroke="url(#orbitLeftGrad)" stroke-width="19" stroke-linecap="round"/>
