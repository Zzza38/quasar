<svg xmlns="http://www.w3.org/2000/svg" viewBox="192 54 880 880" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">Quasar logo</title>
<desc id="desc">Crisp vector Quasar logo with stars inside the large Q.</desc>
<defs>
  <radialGradient id="qGrad" cx="72%" cy="21%" r="92%">
    <stop offset="0%" stop-color="#1559c7"/><stop offset="28%" stop-color="#10469f"/><stop offset="58%" stop-color="#0b3276"/><stop offset="100%" stop-color="#082357"/>
  </radialGradient>
  <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#082357"/><stop offset="48%" stop-color="#09245a"/><stop offset="100%" stop-color="#0a285f"/>
  </linearGradient>
  <linearGradient id="orbitLeftGrad" x1="235" y1="640" x2="585" y2="620" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#8763fc"/><stop offset="52%" stop-color="#617afc"/><stop offset="100%" stop-color="#3477f8"/>
  </linearGradient>
  <linearGradient id="orbitRightGrad" x1="661" y1="595" x2="1015" y2="350" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#3778f9"/><stop offset="58%" stop-color="#5578fb"/><stop offset="100%" stop-color="#7d67fc"/>
  </linearGradient>
  <linearGradient id="orbitTopGrad" x1="833" y1="260" x2="1016" y2="260" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#7865fc"/><stop offset="100%" stop-color="#9662fc"/>
  </linearGradient>
  <linearGradient id="planetGrad" x1="985" y1="286" x2="1043" y2="347" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#8f68fc"/><stop offset="42%" stop-color="#526ffc"/><stop offset="100%" stop-color="#1e72f7"/>
  </linearGradient>
  <linearGradient id="starGrad" x1="452" y1="488" x2="797" y2="488" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#2977f9"/><stop offset="48%" stop-color="#5f84fc"/><stop offset="100%" stop-color="#9167fc"/>
  </linearGradient>
  <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="20%" stop-color="#ffffff" stop-opacity=".96"/><stop offset="52%" stop-color="#d8efff" stop-opacity=".58"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="dotGlow" x="-250%" y="-250%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>
<!-- Large Q: mathematically smooth ellipses -->
<path d="M622 194 A300 294 0 1 1 621.9 782 A300 294 0 1 1 622 194 Z M622 273 A217 214 0 1 0 622.1 701 A217 214 0 1 0 622 273 Z" fill="url(#qGrad)" fill-rule="evenodd"/>
<path d="M758 657 Q779 631 804 644 L927 765 Q936 774 934 783 Q932 791 923 791 L842 791 Q836 791 831 786 L765 721 Q751 708 750 691 Q750 673 758 657 Z" fill="url(#qGrad)"/>

